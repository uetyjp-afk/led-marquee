<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>電光掲示板</title>
    <style>
      :root {
        --bg: #f4f4f6;
        --surface: #ffffff;
        --surface-2: #ececf0;
        --ink: #17171c;
        --ink-2: #55555f;
        --line: #d9d9e0;
        --accent: #e8590c;
        --accent-ink: #ffffff;
        --accent-soft: #fdeee3;
        --preview-bg: #060607;
        --radius: 14px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101013;
          --surface: #1b1b20;
          --surface-2: #26262d;
          --ink: #f2f2f5;
          --ink-2: #a8a8b3;
          --line: #34343d;
          --accent: #ff7a29;
          --accent-soft: #3a2415;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      button { font-family: inherit; cursor: pointer; }
      button, select, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      h1 {
        font-size: 1.65rem;
        font-weight: 900;
        letter-spacing: .02em;
        margin: 4px 0 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 .dotgrid {
        display: inline-grid;
        grid-template-columns: repeat(3, 5px);
        gap: 3px;
        flex: none;
      }
      h1 .dotgrid i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
      h1 .dotgrid i:nth-child(2), h1 .dotgrid i:nth-child(4), h1 .dotgrid i:nth-child(9) { opacity: .25; }
      .lead { color: var(--ink-2); font-size: .95rem; margin: 0 0 20px; line-height: 1.6; }

      section { margin-bottom: 22px; }
      .sec-label {
        font-size: .82rem;
        font-weight: 800;
        color: var(--ink-2);
        margin: 0 0 8px;
        letter-spacing: .04em;
      }

      textarea {
        width: 100%;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.5;
        padding: 14px 16px;
        resize: vertical;
        min-height: 84px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .err {
        display: none;
        color: #d92b1f;
        font-size: .9rem;
        font-weight: 700;
        margin-top: 6px;
      }
      .err.show { display: block; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip {
        border: 1.5px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: .92rem;
        font-weight: 700;
        min-height: 40px;
      }
      .chip:active { background: var(--accent-soft); border-color: var(--accent); }

      /* ---- preview ---- */
      .preview {
        background: var(--preview-bg);
        border-radius: var(--radius);
        height: 92px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
      }
      .preview .track {
        display: flex;
        white-space: nowrap;
        will-change: transform;
      }
      .preview .seg {
        font-weight: 900;
        font-size: 44px;
        line-height: 1.15;
        padding-right: .8em;
      }
      .preview.static { justify-content: center; }
      .preview-note { font-size: .8rem; color: var(--ink-2); margin-top: 6px; }

      /* ---- settings card ---- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 6px 16px;
      }
      .row { padding: 14px 0; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: none; }
      .row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
      .row-name { font-weight: 800; font-size: 1rem; }
      .row-val { color: var(--accent); font-weight: 800; font-size: .95rem; font-variant-numeric: tabular-nums; }
      .slider-labels { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-2); margin-top: 2px; }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        height: 36px;
        margin: 0;
      }

      .seg-control { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
      #modeSeg { flex-wrap: wrap; }
      #modeSeg button { flex: 1 1 38%; }
      .seg-control button {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--ink-2);
        font-weight: 800;
        font-size: .95rem;
        border-radius: 8px;
        min-height: 42px;
        padding: 6px 4px;
      }
      .seg-control button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.18); }

      .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
      .sw {
        width: 46px; height: 46px;
        border-radius: 50%;
        border: 2px solid var(--line);
        padding: 0;
        position: relative;
        flex: none;
      }
      .sw.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); }
      .sw-name { font-size: .78rem; color: var(--ink-2); margin-top: 6px; font-weight: 700; min-height: 1em; }

      .start-btn {
        width: 100%;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 1.3rem;
        font-weight: 900;
        border-radius: var(--radius);
        min-height: 64px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 6px 18px rgba(232, 89, 12, .35);
      }
      .start-btn:active { transform: scale(.985); }
      .start-btn .tri {
        width: 0; height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 14px solid var(--accent-ink);
      }
      .howto {
        margin-top: 14px;
        font-size: .88rem;
        color: var(--ink-2);
        line-height: 1.7;
        text-align: center;
      }

      /* ---- display mode ---- */
      #stage {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        overflow: hidden;
        align-items: center;
        background: #000;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage.show { display: flex; }
      #stageTrack {
        display: flex;
        white-space: nowrap;
        will-change: transform;
      }
      #stageTrack .seg {
        font-weight: 900;
        line-height: 1.12;
        padding-right: .7em;
        letter-spacing: .01em;
      }
      #stage.static { justify-content: center; }
      #stage.static #stageTrack .seg { padding-right: 0; white-space: normal; text-align: center; }
      .glow { text-shadow: 0 0 18px currentColor, 0 0 46px currentColor; }
      #stageHint {
        position: absolute;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: rgba(0,0,0,.55);
        color: #fff;
        font-size: .85rem;
        font-weight: 700;
        padding: 9px 18px;
        border-radius: 999px;
        pointer-events: none;
        transition: opacity .6s;
        white-space: nowrap;
      }
      #stageHint.fade { opacity: 0; }
    </style>
  <link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
</head>
  <body>
    <div class="wrap" id="settingsView">
      <h1><span class="dotgrid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>電光掲示板</h1>
      <p class="lead">文字を入れると、画面いっぱいの大きな文字が横に流れ続けます。お迎えや合図、受付の案内にどうぞ。</p>

      <section>
        <p class="sec-label">表示する文字</p>
        <textarea id="msgInput" rows="2" maxlength="100" placeholder="ここに文字を入力">お迎えに来ました！</textarea>
        <p class="err" id="msgErr">文字を入力してください。</p>
        <div class="chips" id="chips"></div>
      </section>

      <section>
        <p class="sec-label">プレビュー</p>
        <div class="preview" id="preview"><div class="track" id="previewTrack"></div></div>
        <p class="preview-note">実際の表示は全画面になります。横向きにすると、より大きく見えます。</p>
      </section>

      <section>
        <p class="sec-label">設定</p>
        <div class="card">
          <div class="row">
            <div class="row-head"><span class="row-name">流れ方</span></div>
            <div class="seg-control" id="modeSeg">
              <button type="button" data-mode="scroll" class="on">横に流れる</button>
              <button type="button" data-mode="pause">真ん中で止まる</button>
              <button type="button" data-mode="blink">点滅</button>
              <button type="button" data-mode="static">止まって表示</button>
            </div>
          </div>
          <div class="row" id="speedRow">
            <div class="row-head"><span class="row-name">流れる速さ</span><span class="row-val" id="speedVal"></span></div>
            <input type="range" id="speedRange" min="1" max="10" step="1" value="5" aria-label="流れる速さ" />
            <div class="slider-labels"><span>ゆっくり</span><span>はやい</span></div>
          </div>
          <div class="row">
            <div class="row-head"><span class="row-name">文字の大きさ</span><span class="row-val" id="sizeVal"></span></div>
            <input type="range" id="sizeRange" min="1" max="10" step="1" value="7" aria-label="文字の大きさ" />
            <div class="slider-labels"><span>小さい</span><span>大きい</span></div>
          </div>
          <div class="row">
            <div class="row-head"><span class="row-name">文字の色</span></div>
            <div class="swatches" id="fgSwatches"></div>
            <p class="sw-name" id="fgName"></p>
          </div>
          <div class="row">
            <div class="row-head"><span class="row-name">背景の色</span></div>
            <div class="swatches" id="bgSwatches"></div>
            <p class="sw-name" id="bgName"></p>
          </div>
          <div class="row">
            <div class="row-head"><span class="row-name">文字を光らせる</span></div>
            <div class="seg-control" id="glowSeg">
              <button type="button" data-glow="on" class="on">光らせる</button>
              <button type="button" data-glow="off">光らせない</button>
            </div>
          </div>
          <div class="row" id="glowColorRow">
            <div class="row-head"><span class="row-name">光の色（文字の周りの色）</span></div>
            <div class="swatches" id="glowSwatches"></div>
            <p class="sw-name" id="glowName"></p>
          </div>
        </div>
      </section>

      <button type="button" class="start-btn" id="startBtn"><span class="tri" aria-hidden="true"></span>全画面で表示</button>
      <p class="howto">表示中は画面が消えないようにします（対応機種のみ）。<br />表示をやめるときは、画面をタップしてください。</p>
    </div>

    <div id="stage" role="button" aria-label="タップすると設定画面に戻ります">
      <div id="stageTrack"></div>
      <div id="stageHint">タップすると戻ります</div>
    </div>

    <script>
      (function () {
        var PRESETS = ["お迎えに来ました！", "こちらです", "ありがとうございます", "ようこそ！", "おめでとうございます", "まもなく出発します"];
        var FG = [
          { name: "黄色", value: "#ffd21f" },
          { name: "白", value: "#ffffff" },
          { name: "オレンジ", value: "#ff8c1a" },
          { name: "赤", value: "#ff4038" },
          { name: "水色", value: "#2fd9ff" },
          { name: "緑", value: "#3dff6e" },
          { name: "ピンク", value: "#ff7ad9" }
        ];
        var BG = [
          { name: "黒", value: "#000000" },
          { name: "紺", value: "#0a1a3f" },
          { name: "暗い緑", value: "#062b16" },
          { name: "暗い赤", value: "#38090b" },
          { name: "こげ茶", value: "#241505" },
          { name: "白", value: "#ffffff" }
        ];
        var SPEED_LABELS = ["とてもゆっくり", "ゆっくり", "ゆっくり", "ややゆっくり", "ふつう", "ふつう", "ややはやい", "はやい", "はやい", "とてもはやい"];
        var SIZE_LABELS = ["特小", "小", "やや小", "やや小", "中", "中", "やや大", "大", "大", "特大"];

        var state = { mode: "scroll", speed: 5, size: 7, fg: FG[0].value, bg: BG[0].value, glow: true, glowColor: "same" };

        var msgInput = document.getElementById("msgInput");
        var msgErr = document.getElementById("msgErr");
        var preview = document.getElementById("preview");
        var previewTrack = document.getElementById("previewTrack");
        var stage = document.getElementById("stage");
        var stageTrack = document.getElementById("stageTrack");
        var stageHint = document.getElementById("stageHint");
        var speedRange = document.getElementById("speedRange");
        var sizeRange = document.getElementById("sizeRange");

        /* ---------- chips ---------- */
        var chips = document.getElementById("chips");
        PRESETS.forEach(function (t) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = t;
          b.addEventListener("click", function () {
            msgInput.value = t;
            msgErr.classList.remove("show");
            renderPreview();
          });
          chips.appendChild(b);
        });

        /* ---------- swatches ---------- */
        function buildSwatches(el, list, nameEl, key) {
          list.forEach(function (c) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "sw" + (state[key] === c.value ? " on" : "");
            b.style.background = c.value;
            b.setAttribute("aria-label", c.name);
            b.addEventListener("click", function () {
              state[key] = c.value;
              nameEl.textContent = c.name;
              var all = el.querySelectorAll(".sw");
              for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
              b.classList.add("on");
              renderPreview();
            });
            el.appendChild(b);
          });
          var cur = list.filter(function (c) { return c.value === state[key]; })[0];
          nameEl.textContent = cur ? cur.name : "";
        }
        buildSwatches(document.getElementById("fgSwatches"), FG, document.getElementById("fgName"), "fg");
        buildSwatches(document.getElementById("bgSwatches"), BG, document.getElementById("bgName"), "bg");

        /* glow color: "same" = same as the text color, otherwise a fixed color */
        (function buildGlowSwatches() {
          var el = document.getElementById("glowSwatches");
          var nameEl = document.getElementById("glowName");
          var items = [{ name: "文字と同じ", value: "same", bg: "linear-gradient(135deg,#ffd21f 0%,#ff7ad9 50%,#2fd9ff 100%)" }]
            .concat(FG.map(function (c) { return { name: c.name, value: c.value, bg: c.value }; }));
          items.forEach(function (c) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "sw" + (state.glowColor === c.value ? " on" : "");
            b.style.background = c.bg;
            b.setAttribute("aria-label", c.name);
            b.addEventListener("click", function () {
              state.glowColor = c.value;
              nameEl.textContent = c.name;
              var all = el.querySelectorAll(".sw");
              for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
              b.classList.add("on");
              renderPreview();
            });
            el.appendChild(b);
          });
          nameEl.textContent = "文字と同じ";
        })();

        function applyGlow(segEl) {
          segEl.classList.remove("glow");
          segEl.style.textShadow = "";
          if (!state.glow) return;
          if (state.glowColor === "same") segEl.classList.add("glow");
          else segEl.style.textShadow = "0 0 18px " + state.glowColor + ", 0 0 46px " + state.glowColor;
        }

        /* ---------- segmented controls ---------- */
        function seg(id, attr, fn) {
          var box = document.getElementById(id);
          box.addEventListener("click", function (e) {
            var btn = e.target.closest("button");
            if (!btn) return;
            var all = box.querySelectorAll("button");
            for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
            btn.classList.add("on");
            fn(btn.getAttribute(attr));
          });
        }
        seg("modeSeg", "data-mode", function (v) {
          state.mode = v;
          document.getElementById("speedRow").style.display = (v === "scroll" || v === "pause") ? "" : "none";
          renderPreview();
        });
        seg("glowSeg", "data-glow", function (v) {
          state.glow = v === "on";
          document.getElementById("glowColorRow").style.display = state.glow ? "" : "none";
          renderPreview();
        });

        /* ---------- sliders ---------- */
        function syncLabels() {
          document.getElementById("speedVal").textContent = SPEED_LABELS[state.speed - 1];
          document.getElementById("sizeVal").textContent = SIZE_LABELS[state.size - 1];
        }
        speedRange.addEventListener("input", function () { state.speed = +speedRange.value; syncLabels(); renderPreview(); });
        sizeRange.addEventListener("input", function () { state.size = +sizeRange.value; syncLabels(); renderPreview(); });
        syncLabels();

        msgInput.addEventListener("input", function () {
          msgErr.classList.remove("show");
          renderPreview();
        });

        function text() { return msgInput.value.replace(/\s*\n\s*/g, " ").trim(); }

        /* speed: slider 1..10 -> px per second */
        function pxPerSec() { return 40 + state.speed * state.speed * 4.2; }

        /* Build a track with enough repeats to fill 2x width, doubled for a seamless loop. */
        function fillTrack(track, msg, containerWidth, fontPx) {
          track.innerHTML = "";
          var probe = document.createElement("span");
          probe.className = "seg";
          probe.style.fontSize = fontPx + "px";
          probe.textContent = msg;
          probe.style.visibility = "hidden";
          probe.style.position = "absolute";
          track.appendChild(probe);
          var segW = probe.getBoundingClientRect().width || fontPx * msg.length;
          track.removeChild(probe);
          var reps = Math.max(2, Math.ceil((containerWidth * 2.2) / Math.max(segW, 1)));
          var half = "";
          for (var i = 0; i < reps; i++) half += '<span class="seg"></span>';
          track.innerHTML = half + half;
          var segs = track.querySelectorAll(".seg");
          for (var j = 0; j < segs.length; j++) {
            segs[j].textContent = msg;
            segs[j].style.fontSize = fontPx + "px";
          }
          return segW * reps;
        }

        /* Scrolling is driven by requestAnimationFrame, not CSS animation:
           some phone browsers / in-app webviews freeze CSS animations
           (reduced-motion settings, fullscreen changes), so moving the
           transform from JS keeps the sign flowing everywhere. */
        function makeScroller(track) {
          return { track: track, mode: "scroll", half: 0, offset: 0, active: false, segW: 0, contW: 0, phase: "in", x: 0, holdT: 0, blinkT: 0, visible: true };
        }
        var previewScroll = makeScroller(previewTrack);
        var stageScroll = makeScroller(stageTrack);
        var lastTs = 0;
        function stepScroll(s, dt) {
          if (!s.active) return;
          if (s.mode === "scroll") {
            if (!s.half) return;
            s.offset = (s.offset + pxPerSec() * dt) % s.half;
            s.track.style.transform = "translate3d(" + (-s.offset).toFixed(1) + "px, 0, 0)";
          } else if (s.mode === "pause") {
            var cx = (s.contW - s.segW) / 2;
            if (s.phase === "in") {
              s.x -= pxPerSec() * dt;
              if (s.x <= cx) { s.x = cx; s.phase = "hold"; s.holdT = 0; }
            } else if (s.phase === "hold") {
              s.holdT += dt;
              if (s.holdT >= 2.5) s.phase = "out";
            } else {
              s.x -= pxPerSec() * dt;
              if (s.x <= -s.segW) { s.x = s.contW; s.phase = "in"; }
            }
            s.track.style.transform = "translate3d(" + s.x.toFixed(1) + "px, 0, 0)";
          } else if (s.mode === "blink") {
            s.blinkT += dt;
            if (s.blinkT >= 0.55) {
              s.blinkT = 0;
              s.visible = !s.visible;
              s.track.style.visibility = s.visible ? "visible" : "hidden";
            }
          }
        }
        function tick(ts) {
          var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 0;
          lastTs = ts;
          stepScroll(previewScroll, dt);
          stepScroll(stageScroll, dt);
          requestAnimationFrame(tick);
        }
        function startScroll(s, halfWidth) {
          s.mode = "scroll";
          s.half = halfWidth;
          s.offset = halfWidth ? s.offset % halfWidth : 0;
          s.active = true;
          s.track.style.visibility = "visible";
          s.track.style.transform = "translate3d(" + (-s.offset).toFixed(1) + "px, 0, 0)";
        }
        function startPause(s, segW, contW) {
          s.mode = "pause";
          s.segW = segW; s.contW = contW;
          s.phase = "in"; s.x = contW; s.holdT = 0;
          s.active = true;
          s.track.style.visibility = "visible";
          s.track.style.transform = "translate3d(" + s.x.toFixed(1) + "px, 0, 0)";
        }
        function startBlink(s) {
          s.mode = "blink";
          s.blinkT = 0; s.visible = true;
          s.active = true;
          s.track.style.visibility = "visible";
          s.track.style.transform = "";
        }
        function stopScroll(s) {
          s.active = false;
          s.offset = 0;
          s.track.style.transform = "";
          s.track.style.visibility = "visible";
          s.visible = true;
        }
        /* one centered segment (pause / blink); returns its width */
        function fillSingle(track, msg, fontPx) {
          track.innerHTML = "";
          var seg = document.createElement("span");
          seg.className = "seg";
          seg.textContent = msg;
          seg.style.fontSize = fontPx + "px";
          seg.style.paddingRight = "0";
          seg.style.color = state.fg;
          applyGlow(seg);
          track.appendChild(seg);
          return seg.getBoundingClientRect().width || fontPx * msg.length;
        }
        requestAnimationFrame(tick);

        /* ---------- preview ---------- */
        function renderPreview() {
          var msg = text() || "（文字を入力してください）";
          preview.style.background = state.bg;
          preview.classList.toggle("static", state.mode === "static" || state.mode === "blink");
          if (state.mode === "static" || state.mode === "blink") {
            previewTrack.innerHTML = "";
            var s = document.createElement("span");
            s.className = "seg";
            s.textContent = msg;
            s.style.color = state.fg;
            s.style.fontSize = "30px";
            s.style.whiteSpace = "normal";
            s.style.textAlign = "center";
            applyGlow(s);
            previewTrack.appendChild(s);
            if (state.mode === "blink") startBlink(previewScroll); else stopScroll(previewScroll);
            return;
          }
          if (state.mode === "pause") {
            var segW = fillSingle(previewTrack, msg, 44);
            startPause(previewScroll, segW, preview.clientWidth);
            return;
          }
          var half = fillTrack(previewTrack, msg, preview.clientWidth, 44);
          var segs = previewTrack.querySelectorAll(".seg");
          for (var i = 0; i < segs.length; i++) {
            segs[i].style.color = state.fg;
            applyGlow(segs[i]);
          }
          startScroll(previewScroll, half);
        }

        /* ---------- stage (fullscreen display) ---------- */
        var wakeLock = null;
        var hintTimer = null;

        function fontPxForStage() {
          var base = Math.min(window.innerWidth, window.innerHeight);
          /* size 1..10 -> 0.22 .. 0.92 of the short side */
          return Math.round(base * (0.15 + state.size * 0.082));
        }

        function renderStage() {
          var msg = text();
          stage.style.background = state.bg;
          stage.classList.toggle("static", state.mode === "static" || state.mode === "blink");
          stopScroll(stageScroll);
          if (state.mode === "static" || state.mode === "blink") {
            stageTrack.innerHTML = "";
            var s = document.createElement("span");
            s.className = "seg";
            s.textContent = msg;
            s.style.color = state.fg;
            s.style.fontSize = fontPxForStage() + "px";
            applyGlow(s);
            stageTrack.appendChild(s);
            if (state.mode === "blink") startBlink(stageScroll);
            return;
          }
          if (state.mode === "pause") {
            var segW = fillSingle(stageTrack, msg, fontPxForStage());
            startPause(stageScroll, segW, window.innerWidth);
            return;
          }
          var half = fillTrack(stageTrack, msg, window.innerWidth, fontPxForStage());
          var segs = stageTrack.querySelectorAll(".seg");
          for (var i = 0; i < segs.length; i++) {
            segs[i].style.color = state.fg;
            applyGlow(segs[i]);
          }
          startScroll(stageScroll, half);
        }

        function requestWake() {
          if ("wakeLock" in navigator) {
            navigator.wakeLock.request("screen").then(function (wl) {
              wakeLock = wl;
            }).catch(function () { /* unsupported / denied: ignore */ });
          }
        }

        function enterStage() {
          if (!text()) {
            msgErr.classList.add("show");
            msgInput.focus();
            msgInput.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          stage.classList.add("show");
          renderStage();
          requestWake();
          var fsEl = stage.requestFullscreen ? stage : document.documentElement;
          if (fsEl.requestFullscreen) {
            var fp = fsEl.requestFullscreen();
            if (fp && fp.catch) fp.catch(function () { /* ignore */ });
          }
          stageHint.classList.remove("fade");
          clearTimeout(hintTimer);
          hintTimer = setTimeout(function () { stageHint.classList.add("fade"); }, 3500);
        }

        function exitStage() {
          stage.classList.remove("show");
          stopScroll(stageScroll);
          clearTimeout(hintTimer);
          if (wakeLock) {
            var wp = wakeLock.release();
            if (wp && wp.catch) wp.catch(function () {});
            wakeLock = null;
          }
          if (document.fullscreenElement) {
            var xp = document.exitFullscreen();
            if (xp && xp.catch) xp.catch(function () {});
          }
          renderPreview();
        }

        document.getElementById("startBtn").addEventListener("click", enterStage);
        stage.addEventListener("click", exitStage);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && stage.classList.contains("show")) exitStage();
        });
        document.addEventListener("fullscreenchange", function () {
          if (!document.fullscreenElement && stage.classList.contains("show")) {
            /* user left fullscreen via system gesture: keep stage but re-render size */
            renderStage();
          }
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && stage.classList.contains("show")) requestWake();
        });
        var resizeTimer = null;
        window.addEventListener("resize", function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            if (stage.classList.contains("show")) renderStage(); else renderPreview();
          }, 200);
        });

        renderPreview();
      })();
    </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});}</script>
</body>
